[tool.ruff]
line-length = 200
indent-width = 4
src = [
    "licyk_style",
    "scripts",
]
exclude = [
    ".git",
    "__pycache__",
    ".github",
]
lint.ignore = [
    "E402", # module-import-not-at-top-of-file
    # TODO: 之后再考虑修复
    "I001",
    "TRY201",
    "PYI041",
    "UP035",
    "SIM117",
    "BLE001",
    "RUF022",
    "SIM114",
    "UP037",
    "B010",
    "TRY004",
    "UP022",
    "PLW1510",
    "B009",
    "SIM102",
    "PYI036",
    "FLY002",
    "PLR0402",
    "UP031",
    "RUF059",
    "SIM102",
    "PLW1510",
    "UP041",
    "FURB188",
    "RUF100",
    "RUF015",
    "B023",
    "PIE790",
    "PERF102",
    "PIE807",
    "UP045",
    "PYI034",
    "S110",
    "RUF012",
    "PIE810",
    "SIM113",
    "PLC0414",
    "DTZ005",
    "UP024",
    "FURB167",
    "RUF023",
    "S102",
    "SIM103",
    "RUF019",
    "SIM115",
    "PLR1730",
    "RUF007",
    "RET501",
    "TRY002",
    "PLR1711",
    "B008",
    "DTZ001",
    "B018",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
output-format = "concise"

[tool.ty.src]
include = [
    "licyk_style",
    "scripts",
    "install.py",
]

[tool.ty.analysis]
# Provided by Stable Diffusion WebUI at runtime
allowed-unresolved-imports = [
    "launch",
    "modules.**",
    "gradio.**",
]
